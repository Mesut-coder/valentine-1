<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mary 😍, My Valentine 💖</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
            text-align: center;
            color: #fff;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 50px;
            font-size: 2.5em;
        }

        p {
            font-size: 1.2em;
            max-width: 600px;
            margin: auto;
        }

        .photos img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .buttons {
            margin-top: 40px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
        }

        .yes {
            background: #ff4d6d;
            color: white;
        }

        .no {
            background: white;
            color: #ff4d6d;
            position: absolute;
        }

        .heart {
            position: fixed;
            bottom: -10px;
            color: red;
            font-size: 20px;
            animation: floatUp 5s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Mary 😍</h1>

    <p>
    When someone becomes your dream even while your eyes are open, you know they’re special.  
    Mary 😍, will you be my Valentine? 💖
    </p>

    <div class="photos">
        <img src="photo1.jpg" alt="Us">
        <img src="photo2.jpg" alt="Love">
        <img src="photo3.jpg" alt="Memories">
    </div>

    <h1>Will you be my Valentine? 💌</h1>

    <div class="buttons">
        <button class="yes" onclick="yesClicked()">YES ❤️</button>
        <button class="no" id="noBtn">NO 😅</button>
    </div>

    <script>
        function yesClicked() {
            document.body.innerHTML = `
                <h1>I knew it! 😍❤️</h1>
                <p>You just made my Valentine’s Day perfect 💕</p>
            `;
        }

        const noBtn = document.getElementById("noBtn");
        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        // Floating hearts
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }, 300);
    </script>

</body>
</html>
